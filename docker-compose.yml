services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
  bff:
    build: ./bff
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["4000:4000"]
  frontend:
    build: ./frontend
    depends_on: [bff]
    ports: ["5173:80"]
