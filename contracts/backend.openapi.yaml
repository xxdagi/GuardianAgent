openapi: 3.0.3
info:
  title: Backend API
  version: 0.2.0
  description: Internal API. Producer - backend (Python). Consumer - bff only.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/realtime/session:
    post:
      summary: Create realtime session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeSessionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeSessionResponse"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v1/alerts:
    post:
      summary: Create alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "422":
          $ref: "#/components/responses/Error"
    get:
      summary: List alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertListItem"
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    RealtimeSessionCreate:
      type: object
      required: [session_id, language, alert_phrases, emergency_phrases]
      properties:
        session_id:
          type: string
          description: Frontend-generated call/session UUID.
        language:
          type: string
          enum: [pl, en]
          description: UI and transcription language.
        alert_phrases:
          type: array
          items:
            type: string
          description: Level 1 code phrases.
        emergency_phrases:
          type: array
          items:
            type: string
          description: Level 2 code phrases.
    RealtimeSessionResponse:
      type: object
      required: [client_secret, expires_at, model]
      properties:
        client_secret:
          type: string
          description: Ephemeral OpenAI client secret.
        expires_at:
          type: string
          format: date-time
          description: Secret expiry timestamp.
        model:
          type: string
          description: Realtime model name.
    AlertCreate:
      type: object
      required: [session_id, level, source, language, recipient_name, recipient_phone, location]
      properties:
        session_id:
          type: string
          description: Call/session UUID.
        level:
          type: string
          enum: [alert, emergency]
          description: Alert severity.
        source:
          type: string
          enum: [keyword, agent, manual]
          description: Alert origin.
        trigger_phrase:
          type: string
          description: Detected phrase or manual trigger note.
        language:
          type: string
          enum: [pl, en]
          description: Alert language.
        recipient_name:
          type: string
          description: Trusted contact name.
        recipient_phone:
          type: string
          description: Trusted contact phone.
        location:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
          description: GPS coordinates or null if unavailable.
        transcript_snippet:
          type: string
          description: Short transcript excerpt.
    Location:
      type: object
      required: [latitude, longitude, accuracy]
      properties:
        latitude:
          type: number
          description: GPS latitude.
        longitude:
          type: number
          description: GPS longitude.
        accuracy:
          type: number
          description: GPS accuracy in meters.
    Delivery:
      type: object
      required: [channel, status]
      properties:
        channel:
          type: string
          enum: [mock]
          description: Delivery channel.
        status:
          type: string
          enum: [sent, failed]
          description: Delivery status.
    Alert:
      type: object
      required: [id, maps_url, deliveries, created_at]
      properties:
        id:
          type: string
          description: Alert id.
        maps_url:
          type: string
          description: Google Maps link.
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
          description: Delivery results.
        created_at:
          type: string
          format: date-time
          description: Alert creation time.
    AlertListItem:
      type: object
      required: [id, session_id, created_at, level, source, location, deliveries]
      properties:
        id:
          type: string
          description: Alert id.
        session_id:
          type: string
          description: Call/session UUID.
        created_at:
          type: string
          format: date-time
          description: Alert creation time.
        level:
          type: string
          enum: [alert, emergency]
          description: Alert severity.
        source:
          type: string
          enum: [keyword, agent, manual]
          description: Alert origin.
        trigger_phrase:
          type: string
          description: Detected phrase or manual trigger note.
        transcript_snippet:
          type: string
          description: Short transcript excerpt.
        location:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
          description: GPS coordinates or null if unavailable.
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
          description: Delivery results.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, UPSTREAM_ERROR, INTERNAL_ERROR]
            message:
              type: string
            details:
              type: object
